# MyForrest with QGIS Server: WMS/WMTS/WFS/OGC API in LV95 for geoportals
# such as map.geo.admin.ch. See deploy/qgis-server/README.md.
#
#   docker compose up -d
#
# http://localhost:8080/            MyForrest
# http://localhost:8080/ogc         OGC API – Features (MyForrest itself)
# http://localhost:8080/ows/?SERVICE=WMS&REQUEST=GetCapabilities   QGIS Server
# BRouter (path magnet) runs internally; the first start downloads ≈ 400 MB of routing data.
services:
  myforrest:
    build: ../..
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # WMS, WMTS and WFS of QGIS Server in the metadata record for geocat.ch (/api/metadata/geocat.xml).
      METADATA_OWS_URL: ${PUBLIC_URL:-http://localhost:8080}/ows/
      # Path magnet for tours through the own BRouter below instead of brouter.de.
      ROUTER_URL: http://brouter:17777/brouter
      # Forest profile of the own BRouter (deploy/brouter/profiles); brouter.de does not have it.
      ROUTER_PROFILE: myforrest-wald
      # nginx (and a TLS proxy on the host) in front, on private addresses: rate limits per client from X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      # Wildlife rest areas as GeoJSON (BAFU, geo.admin.ch) in the data volume: routed around in their protection period.
      WILDRUHE_GEOJSON: ${WILDRUHE_GEOJSON:-}
    volumes:
      - myforrest-data:/app/data
    restart: unless-stopped

  # Routing along paths (deploy/brouter); loads the segments for BBOX on first start.
  brouter:
    # Built from deploy/brouter; or the prebuilt image: ghcr.io/michifrey/myforrest-brouter
    build: ../brouter
    environment:
      BBOX: ${BROUTER_BBOX:-5.9,45.8,10.5,47.9}
    volumes:
      - brouter-segments:/segments
    restart: unless-stopped

  # Refreshes the GeoPackage QGIS Server publishes (every 15 minutes).
  export:
    image: curlimages/curl:8.10.1
    depends_on: [myforrest]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -o /export/myforrest.gpkg.part http://myforrest:3000/api/export/myforrest.gpkg \
            && mv /export/myforrest.gpkg.part /export/myforrest.gpkg
          sleep 900
        done
    volumes:
      - gis-export:/export
    restart: unless-stopped

  qgis-server:
    image: qgis/qgis-server:ltr
    environment:
      QGIS_PROJECT_FILE: /io/project/myforrest.qgz
      QGIS_SERVER_LOG_LEVEL: 1
      QGIS_SERVER_SERVICE_URL: ${PUBLIC_URL:-http://localhost:8080}/ows/
    volumes:
      - ./project:/io/project:ro
      - gis-export:/io/data:ro
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on: [myforrest, qgis-server]
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  myforrest-data:
  gis-export:
  brouter-segments:

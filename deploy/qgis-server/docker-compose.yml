# MyForrest with QGIS Server: WMS/WMTS/WFS/OGC API in LV95 for geoportals
# such as map.geo.admin.ch. See deploy/qgis-server/README.md.
#
#   docker compose up -d
#
# http://localhost:8080/            MyForrest
# http://localhost:8080/ogc         OGC API – Features (MyForrest itself)
# http://localhost:8080/ows/?SERVICE=WMS&REQUEST=GetCapabilities   QGIS Server
services:
  myforrest:
    build: ../..
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      - myforrest-data:/app/data
    restart: unless-stopped

  # Refreshes the GeoPackage QGIS Server publishes (every 15 minutes).
  export:
    image: curlimages/curl:8.10.1
    depends_on: [myforrest]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -o /export/myforrest.gpkg.part http://myforrest:3000/api/export/myforrest.gpkg \
            && mv /export/myforrest.gpkg.part /export/myforrest.gpkg
          sleep 900
        done
    volumes:
      - gis-export:/export
    restart: unless-stopped

  qgis-server:
    image: qgis/qgis-server:ltr
    environment:
      QGIS_PROJECT_FILE: /io/project/myforrest.qgz
      QGIS_SERVER_LOG_LEVEL: 1
      QGIS_SERVER_SERVICE_URL: ${PUBLIC_URL:-http://localhost:8080}/ows/
    volumes:
      - ./project:/io/project:ro
      - gis-export:/io/data:ro
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on: [myforrest, qgis-server]
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  myforrest-data:
  gis-export:

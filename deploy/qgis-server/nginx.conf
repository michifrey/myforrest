server {
  listen 80;
  client_max_body_size 4g; # video uploads

  # QGIS Server (FastCGI): WMS, WMTS, WFS and OGC API from the QGIS project.
  location /ows/ {
    add_header Access-Control-Allow-Origin "*" always;
    fastcgi_pass qgis-server:5555;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_param REQUEST_METHOD $request_method;
    fastcgi_param CONTENT_TYPE $content_type;
    fastcgi_param CONTENT_LENGTH $content_length;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param SERVER_NAME $server_name;
    fastcgi_param SERVER_PORT $server_port;
    fastcgi_param SERVER_PROTOCOL $server_protocol;
    fastcgi_param HTTPS $https if_not_empty;
  }

  # MyForrest itself, including its OGC API – Features under /ogc.
  location / {
    proxy_pass http://myforrest:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
  }
}

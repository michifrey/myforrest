# BRouter: routing along paths for the path magnet (tours). Segments are
# downloaded on first start into their own volume (≈ 400 MB for Switzerland).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brouter-segments
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brouter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: brouter }
  template:
    metadata:
      labels: { app.kubernetes.io/name: brouter }
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: brouter
          image: brouter
          imagePullPolicy: Never
          env:
            - { name: BBOX, value: "5.9,45.8,10.5,47.9" }
          ports:
            - name: http
              containerPort: 17777
          volumeMounts:
            - name: segments
              mountPath: /segments
          # The first start downloads the segments: allow several minutes.
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: segments
          persistentVolumeClaim:
            claimName: brouter-segments
---
apiVersion: v1
kind: Service
metadata:
  name: brouter
spec:
  selector: { app.kubernetes.io/name: brouter }
  ports:
    - name: http
      port: 17777
      targetPort: http

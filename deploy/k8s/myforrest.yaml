# The Node app with its SQLite database and uploads on a volume. One replica:
# SQLite wants a single writer, and Recreate avoids two pods on the volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myforrest-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myforrest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: myforrest }
  template:
    metadata:
      labels: { app.kubernetes.io/name: myforrest }
    spec:
      # Service links would put variables like QGIS_SERVER_PORT into every pod.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: myforrest
          image: myforrest
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: myforrest-env }
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet: { path: /ogc, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ogc, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: myforrest-data
---
apiVersion: v1
kind: Service
metadata:
  name: myforrest
spec:
  selector: { app.kubernetes.io/name: myforrest }
  ports:
    - name: http
      port: 3000
      targetPort: http

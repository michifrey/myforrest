# MyForrest on Kubernetes: the app, QGIS Server and nginx in front, like
# deploy/qgis-server/docker-compose.yml. See deploy/k8s/README.md.
#
# The ConfigMaps take nginx.conf and the QGIS project from deploy/qgis-server,
# outside this directory, hence:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s | kubectl apply -f -
# (deploy/k8s/start.sh does that, after building and loading the image).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: myforrest
labels:
  - pairs:
      app.kubernetes.io/part-of: myforrest
resources:
  - namespace.yaml
  - myforrest.yaml
  - qgis-server.yaml
  - nginx.yaml
  - brouter.yaml
configMapGenerator:
  - name: nginx-conf
    files:
      - default.conf=../qgis-server/nginx.conf
  - name: qgis-project
    files:
      - ../qgis-server/project/myforrest.qgz
  - name: myforrest-env
    literals:
      - PUBLIC_URL=http://localhost:8080
      - METADATA_OWS_URL=http://localhost:8080/ows/
      # Path magnet through the own BRouter instead of brouter.de.
      - ROUTER_URL=http://brouter:17777/brouter
      # Forest profile of the own BRouter (deploy/brouter/profiles).
      - ROUTER_PROFILE=myforrest-wald
      # nginx in front (private pod addresses): rate limits per client from X-Forwarded-For.
      - TRUST_PROXY=uniquelocal
      # Wildlife rest areas straight from geo.admin.ch (BAFU layer), kept per cell and asked again weekly.
      - WILDRUHE_LAYER=ch.bafu.wrz-wildruhezonen_portal
images:
  # Built locally with podman and loaded into the cluster (start.sh); never pulled.
  - name: myforrest
    newName: localhost/myforrest
    newTag: dev
  - name: brouter
    newName: localhost/myforrest-brouter
    newTag: dev

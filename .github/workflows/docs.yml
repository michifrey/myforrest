# Builds the documentation website (project wiki) from docs/*.md with MkDocs Material
# and publishes it with GitHub Pages. Runs when the docs change on main, and by hand
# (Actions → Run workflow). Pull requests only build (strict: broken links fail).
# Address: the repository variable DOCS_URL (e.g. https://docs.myforrest.xyz/), else the
# GitHub Pages address. Setup: docs/betrieb.md, section "Doku-Website".
name: Doku-Website

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: Bauen
        env:
          DOCS_URL: ${{ vars.DOCS_URL || 'https://michifrey.github.io/myforrest/' }}
        run: mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

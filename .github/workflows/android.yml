# Builds the Android app (android/): unit tests (the drive mode selection must decide like
# public/drive-select.js, test/fixtures/drive-select-cases.json) and the APK as an artifact
# (Actions → run → Artifacts). Server address baked in: the repository variable APP_URL (else the
# app asks on first start). Signed release APK when the secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD exist. Setup: docs/android.md.
name: Android-App

on:
  push:
    branches: [main]
    paths: ['android/**', 'public/drive-select.js', 'test/fixtures/drive-select-cases.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'public/drive-select.js', 'test/fixtures/drive-select-cases.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      MYFORREST_URL: ${{ vars.APP_URL }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests und Debug-APK
        run: ./gradlew --no-daemon test assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: myforrest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Release-APK (signiert)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Kein Schlüssel hinterlegt: nur die Debug-APK."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: myforrest-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
